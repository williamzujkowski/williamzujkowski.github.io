# Complete GitHub Actions Security Scanning Workflow
# Source: https://williamzujkowski.github.io/posts/2025-10-06-automated-security-scanning-pipeline/
# Purpose: Automated vulnerability scanning with Grype, OSV-Scanner, and Trivy
# Usage: Add to .github/workflows/security-scan.yml in your repository

name: Security Scanning Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

# Least privilege. github/codeql-action/upload-sarif requires
# security-events: write -- the docs state it is "required for all workflows"
# (docs.github.com, "Uploading a SARIF file to GitHub"). actions: read and
# contents: read are only needed in a private repository; both are listed
# here because this is meant to be copied into either.
permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  dependency-scan:
    name: Scan Dependencies (OSV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=requirements.txt
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload OSV results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level=="error")] | length' osv-results.sarif)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical vulnerabilities"
            exit 1
          fi

  container-scan:
    name: Scan Container Images (Grype)
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} .

      - name: Run Grype scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          image: "myapp:${{ github.sha }}"
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  comprehensive-scan:
    name: Comprehensive Scan (Trivy)
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  security-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, comprehensive-scan]
    # `always()` lets this job run even when an upstream job failed, so the gate
    # can report on all three. It MUST therefore inspect the upstream results
    # explicitly — without the check below, `always()` makes the gate pass no
    # matter what the scanners found. That is the trap this file used to have.
    if: always()

    steps:
      - name: Evaluate security posture
        env:
          DEPS: ${{ needs.dependency-scan.result }}
          CONTAINER: ${{ needs.container-scan.result }}
          COMPREHENSIVE: ${{ needs.comprehensive-scan.result }}
        run: |
          echo "dependency-scan:    $DEPS"
          echo "container-scan:     $CONTAINER"
          echo "comprehensive-scan: $COMPREHENSIVE"

          failed=0
          for r in "$DEPS" "$CONTAINER" "$COMPREHENSIVE"; do
            # 'skipped' and 'cancelled' are not passes. Treat anything that is
            # not an explicit success as a gate failure.
            if [ "$r" != "success" ]; then failed=$((failed+1)); fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed of 3 security jobs did not succeed. Blocking."
            exit 1
          fi
          echo "All three security jobs succeeded."
