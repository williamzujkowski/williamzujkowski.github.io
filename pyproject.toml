[project]
name = "williamzujkowski-blog"
version = "1.0.0"
description = "William Zujkowski's personal blog and portfolio - automation scripts and content management"
requires-python = ">=3.11"
authors = [
    {name = "William Zujkowski", email = "william@zujkowski.com"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # HTTP client for link validation CI pipeline
    "aiohttp>=3.14.3",
    "certifi>=2023.0.0",

    # Progress bars for batch link validation
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    # Code quality
    "ruff>=0.1.0",
    # Link-validation regression tests
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["scripts/link-validation/tests"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
# One-shot corpus-analysis scripts, written to be read top-to-bottom as a
# single pass rather than imported. The compressed `if x: return` /
# `a = 1; b = 2` style is deliberate there and rewriting it would obscure
# the analysis without making anything safer. Everything else under
# scripts/ is held to the full rule set.
"scripts/corpus-audit/*.py" = ["E701", "E702", "E402"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
