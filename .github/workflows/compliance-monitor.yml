name: Compliance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Least-privilege default: compliance-check only reads the tree to build +
# audit. security-scan overrides this with its own job-level block (it needs
# security-events: write to upload SARIF). Matches every other workflow.
permissions:
  contents: read

jobs:
  # Path gating for compliance-check only. security-scan stays ungated on
  # purpose: gitleaks scans the whole history for secrets, and "this PR only
  # touched docs" is not a reason to skip that.
  #
  # Job-level rather than `on: paths:`, for the same reason as the other
  # workflows: a trigger-filtered workflow never reports at all on a
  # non-matching PR, and a skipped job still reports. Neither of this
  # workflow's checks is required today, but making them required later
  # should not require restructuring first.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content: ${{ steps.diff.outputs.content }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             [ "${{ github.event_name }}" != "push" ]; then
            echo "content=true" >> "$GITHUB_OUTPUT"   # schedule/dispatch: run it
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "content=true" >> "$GITHUB_OUTPUT"   # can't diff: run everything
          elif git diff --name-only "$BASE"...HEAD \
               | grep -qE '^(astro-site/|src/|scripts/compliance/)'; then
            echo "content=true" >> "$GITHUB_OUTPUT"
          else
            echo "content=false" >> "$GITHUB_OUTPUT"
          fi

  compliance-check:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      with:
        version: 10

    - name: Use Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: astro-site/pnpm-lock.yaml

    - name: Install dependencies
      run: cd astro-site && pnpm install --frozen-lockfile

    - name: Cache Astro font downloads (issue #408 — avoid transient jsdelivr fetch)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: astro-site/node_modules/.astro/fonts
        key: astro-fonts-${{ hashFiles('astro-site/astro.config.mjs', 'astro-site/pnpm-lock.yaml') }}
        restore-keys: |
          astro-fonts-
    - name: Build site
      run: cd astro-site && pnpm run build
      continue-on-error: false

    # External link health is owned by link-monitor.yml (Python pipeline,
    # daily cron + per-PR trigger on src/posts/**). The previous lychee step
    # here scanned ./astro-site/src/**/*.md while the actual posts live at
    # ./src/posts/**, so it was finding nothing useful.

    - name: Run Lighthouse CI
      run: |
        cd astro-site
        npx serve -l 4321 dist &
        SERVER_PID=$!
        sleep 3
        npx lighthouse http://localhost:4321/ \
          --output=json --output=html \
          --output-path=../lighthouse-report \
          --chrome-flags="--headless --no-sandbox" \
          --only-categories=performance,accessibility,best-practices,seo || true
        kill $SERVER_PID 2>/dev/null || true
      continue-on-error: true
      timeout-minutes: 5

    - name: Validate HTML
      uses: cyb3r-jak3/html5validator-action@4ea5e57383ed7e14432ebbaae1b64893b7c5210b  # v8.0.0
      with:
        root: astro-site/dist/
        css: true
      continue-on-error: true

    # Accessibility is owned by a11y.yml (axe-playwright on every push/PR).
    # The previous duplicate axe step here ran the same tool on the same SHA.

    - name: Content compliance + citation coverage (advisory)
      run: |
        # Extracted from two ~40-line `python3 -c "..."` blocks that lived
        # here with shell-escaped quotes (#511). Now a real script: readable,
        # testable, and linted by ruff via tests.yml.
        #
        # Still advisory -- neither metric fails the build, per AGENTS.md,
        # which assigns the contextual NDA judgment to the Layer-1
        # blog-nda-check skill. But it now exits non-zero if it scans ZERO
        # posts, because an empty walk must not read as a clean pass.
        # stdlib only, so no uv/venv setup needed in this job.
        python3 scripts/compliance/content_check.py --posts-dir src/posts

    - name: Generate compliance report
      if: always()
      run: |
        echo "# Compliance Report" > compliance-report.md
        echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> compliance-report.md
        echo "" >> compliance-report.md
        echo "## Build Status" >> compliance-report.md
        echo "- Build: ${{ job.status }}" >> compliance-report.md
        echo "" >> compliance-report.md
        # Only list checks this workflow actually runs. It previously ticked
        # "Link checking (Lychee)" and "Accessibility (axe-core)", both of
        # which were deleted from this file (see the comments above) and are
        # owned by link-monitor.yml and a11y.yml respectively.
        echo "## Checks Performed" >> compliance-report.md
        echo "- [x] Site build validation" >> compliance-report.md
        echo "- [x] Lighthouse performance audit" >> compliance-report.md
        echo "- [x] HTML validation" >> compliance-report.md
        echo "- [x] Citation coverage" >> compliance-report.md
        echo "- [x] Content compliance" >> compliance-report.md

    - name: Upload compliance report
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
      with:
        name: compliance-report
        path: |
          compliance-report.md
          lighthouse-report*
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        # Full history: gitleaks scans commit ranges; a shallow checkout made
        # it scan ~0 bytes and error -- silently, until the step became blocking.
        fetch-depth: 0

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@256d634097be96e792d6764f9edaefc4320557b1  # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Run Gitleaks secret scan
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run pip-audit on Python dependencies
      run: |
        pip install pip-audit uv
        # requirements.txt was removed (duplicate of pyproject.toml) -- export
        # the locked runtime deps for pip-audit instead.
        uv export --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
        pip-audit -r /tmp/requirements-audit.txt --output pip-audit-results.json --format json || true
      continue-on-error: true

    - name: Upload security results
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
      if: always()
      with:
        name: security-results
        path: |
          trivy-results.sarif
          pip-audit-results.json
        retention-days: 30
