name: Link Health Monitor

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/posts/**/*.md'

# Least privilege. check-links is now the only job: it opens a tracking issue
# on scheduled failures (issues: write) and comments on PRs
# (pull-requests: write). It never needs `contents: write` -- the job that did
# was removed with the auto-repair path (#495).
#
# Note this workflow runs on `pull_request`, so a fork PR's Python is executed
# on the runner. GitHub forces GITHUB_TOKEN read-only for fork PRs regardless
# of this block, so the write scopes are inert there -- but that means
# "Send write tokens to workflows from fork pull requests" must stay OFF in
# repository settings. Recorded as an invariant, not an assumption.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
      with:
        python-version: '3.11'

    - name: Install UV
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Install Python Dependencies
      run: |
        uv pip install --system --upgrade pip
        uv pip install --system "aiohttp>=3.13.3" "urllib3>=2.6.3"

    - name: Extract Links
      run: |
        uv run python scripts/link-validation/link-extractor.py \
          --posts-dir src/posts \
          --output links.json

    - name: Validate Links
      run: |
        uv run python scripts/link-validation/simple-validator.py \
          --links links.json \
          --output validation.json

    - name: Find Repairs
      run: |
        mkdir -p reports
        # Create placeholder relevance file
        echo '{"results": []}' > relevance.json

        # Write repairs.json INTO reports/ so the suggestions travel in the
        # uploaded artifact for a human to review. Nothing applies them
        # automatically any more (#495).
        uv run python scripts/link-validation/citation-repair.py \
          --links links.json \
          --validation validation.json \
          --relevance relevance.json \
          --output reports/repairs.json || true

    - name: Generate Reports
      run: |
        mkdir -p reports
        uv run python scripts/link-validation/link-report-generator.py \
          --links links.json \
          --validation validation.json \
          --relevance relevance.json \
          --repairs reports/repairs.json \
          --output-dir reports

        # Ship links.json in the artifact too, so a human reviewing the
        # report has the extracted-link set that produced it. (It also
        # remains the input batch-link-fixer.py expects if run manually --
        # it hardcodes open('links.json') in the working directory.)
        cp links.json reports/links.json

    - name: Upload Reports
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
      with:
        name: link-validation-reports
        path: reports/

    - name: Check for Critical Issues
      id: check_critical
      run: |
        # Parse validation results for critical issues
        # Separate internal vs external link failures
        python -c "
        import json, os
        with open('validation.json', 'r') as f:
            data = json.load(f)

        results = data.get('results', [])
        total = len(results)

        # Separate internal (relative paths, same-domain) vs external links
        internal_broken = []
        external_broken = []
        for r in results:
            if r.get('status') == 'broken':
                url = r.get('url', '')
                if url.startswith('/') or url.startswith('#') or 'williamzujkowski' in url:
                    internal_broken.append(r)
                else:
                    external_broken.append(r)

        all_broken = len(internal_broken) + len(external_broken)
        broken_pct = (all_broken / total * 100) if total > 0 else 0

        print(f'Total links: {total}')
        print(f'Internal broken: {len(internal_broken)}')
        print(f'External broken: {len(external_broken)} (may be transient)')
        print(f'Overall: {all_broken}/{total} ({broken_pct:.1f}%)')

        # Set output for use in other steps
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'broken_count={all_broken}\n')
            f.write(f'total_count={total}\n')
            f.write(f'broken_percent={broken_pct:.1f}\n')
            f.write(f'internal_broken={len(internal_broken)}\n')
            f.write(f'external_broken={len(external_broken)}\n')

        # INTERNAL links are not this workflow's job any more (issue #502).
        # They resolve against files on disk, and aiohttp cannot even express
        # a relative path -- it raises InvalidURL, which is recorded as
        # 'needs_manual', so the old `status == broken` test could never see
        # them. 182 links, ~12% of the corpus, were exempt by construction.
        # scripts/link-validation/internal-link-check.py checks them properly
        # in a11y.yml, offline and blocking. The count is still reported here
        # because a non-zero value would mean the two disagree.
        if internal_broken:
            print(f'NOTE: {len(internal_broken)} absolute own-domain links look broken. '
                  'internal-link-check.py in a11y.yml is authoritative for these.')

        # EXTERNAL rot stays advisory: it is a property of the network, not of
        # this commit, so it must never fail a build. It DOES need somewhere to
        # surface -- previously a >50% failure rate printed a warning and
        # exited 0, so the issue-filing step (gated on `failure()`) could never
        # fire and external rot was reported to nobody.
        print(f'External failures: {len(external_broken)} ({broken_pct:.1f}% of all links)')
        "

    # Fires on the scheduled run when external rot crosses the threshold --
    # NOT on `failure()`, which never happened because nothing exits non-zero
    # for external links. The job stays green; the issue is the output.
    - name: Create Issue for Broken Links
      if: >-
        always() && github.event_name == 'schedule' &&
        fromJSON(steps.check_critical.outputs.external_broken || '0') > 5
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('reports/summary.md', 'utf8');

          const title = `🔗 External link rot: ${process.env.external_broken} link(s) not resolving`;
          const body = `## External link health report\n\n` +
                `_Advisory. The job did not fail — external availability is a property of\n`+
                `the network, not of any commit. Internal links and anchors are checked\n`+
                `separately and blockingly by internal-link-check.py in a11y.yml._\n\n` +
                `**Date:** ${new Date().toISOString()}\n` +
                `**Broken Links:** ${process.env.broken_count}/${process.env.total_count} (${process.env.broken_percent}%)\n\n` +
                `### Summary Report\n\n${report}\n\n` +
                `View full reports in the [workflow artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

          // Dedup guard: this job runs on the daily schedule trigger. Without
          // this check, a persistent breakage files a brand-new issue every
          // day instead of updating the existing tracking issue -- mirrors
          // the list-then-update pattern in citation-validation.yml.
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'automated,link-health'
          });

          if (issues.data.length > 0) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              title: title,
              body: body
            });
            console.log(`Updated existing issue #${issues.data[0].number}`);
          } else {
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: 'automated,link-health'
            });
            console.log(`Created new issue #${newIssue.data.number}`);
          }
      env:
        broken_count: ${{ steps.check_critical.outputs.broken_count }}
        total_count: ${{ steps.check_critical.outputs.total_count }}
        broken_percent: ${{ steps.check_critical.outputs.broken_percent }}
        external_broken: ${{ steps.check_critical.outputs.external_broken }}

    - name: Comment on PR
      # always(): if the gate step exits non-zero the comment is MORE useful,
      # not less. Without this it was skipped in exactly that case.
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('reports/summary.md', 'utf8');

          // Extract key metrics
          const validation = JSON.parse(fs.readFileSync('validation.json', 'utf8'));
          const broken = validation.results.filter(r => r.status === 'broken').length;
          const total = validation.results.length;

          let emoji = '✅';
          let status = 'passed';
          if (broken > 0) {
            emoji = broken > 10 ? '❌' : '⚠️';
            status = broken > 10 ? 'failed' : 'warning';
          }

          // Create PR comment
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${emoji} **Link Validation Results**\n\n` +
                  `- **Total Links:** ${total}\n` +
                  `- **Broken Links:** ${broken}\n` +
                  `- **Status:** ${status}\n\n` +
                  `<details>\n<summary>View Full Report</summary>\n\n${summary}\n</details>`
          });

  # The repair-links job was removed here (issue #495).
  #
  # It ran daily for months and never once opened a repair PR: only
  # identity-preserving DOI repairs clear the --confidence-threshold 95 the
  # workflow passed, and those are rare. Meanwhile it carried three
  # reproduced corruption modes in batch-link-fixer._replace_url --
  # rewriting URLs inside code fences, inline code and blockquotes;
  # prefix-collision (repairing ex.com/a also rewrote ex.com/abc); and
  # mangled prose when the extractor truncated a parenthesised URL. Its
  # confidence cap (min(confidence, 90)) was also equal to the tool's own
  # default threshold, so the cap gated nothing outside this workflow.
  #
  # Detection and reporting above are kept -- they are the part that worked.
  # Repair is a human step now: read reports/ from the uploaded artifact.
  # scripts/link-validation/batch-link-fixer.py is retained for manual,
  # supervised use and still defaults to a dry run.
