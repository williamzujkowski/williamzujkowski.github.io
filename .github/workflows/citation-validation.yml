name: Citation Link Validation

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9 AM UTC
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # `uv pip install --system` installs into the SYSTEM interpreter, but
      # every step below runs `uv run`, which uses the project venv resolved
      # from pyproject.toml + uv.lock. They are different interpreters, so
      # this installed nothing the scripts could see (issue #496).
      #
      # The visible consequence: link-validator.py guards its playwright
      # import in a try/except, so PLAYWRIGHT_AVAILABLE was ALWAYS False here.
      # Its browser-based escalation at :252 — the path that re-checks links
      # plain HTTP could not validate, i.e. JS-rendered pages and anti-bot
      # walls — never ran, and this workflow auto-files an issue telling the
      # author to replace citations it classified as broken. Meanwhile
      # `playwright install chromium` downloaded a browser every Monday for
      # nothing.
      #
      # `uv run --with` injects into the environment the script actually runs
      # in. requests and beautifulsoup4 are dropped: no script imports either.
      - name: Install Playwright + browser
        run: |
          uv run --with playwright playwright install --with-deps chromium

      - name: Extract citation links
        id: extract
        run: |
          uv run python scripts/link-validation/link-extractor.py \
            --posts-dir src/posts \
            --output citation-links.json \
            --citations-only

          # Count total citations
          TOTAL_CITATIONS=$(jq '.links | length' citation-links.json)
          echo "total_citations=$TOTAL_CITATIONS" >> $GITHUB_OUTPUT
          echo "Found $TOTAL_CITATIONS citation links to validate"

      # Wrapped in `timeout` so exhausting the budget FAILS the step.
      #
      # The job-level `timeout-minutes` below is the backstop, and GitHub
      # reports hitting it as "cancelled", not "failure" -- which reads as
      # benign in a run list. This job was silently killed at 30m00s on both
      # 2026-08-24 and 2026-08-31 and produced no report either week; nothing
      # was red, so nothing was noticed. An explicit non-zero exit is the
      # difference between a gate that stopped working and a gate that says so.
      #
      # Sized from MEASURED runs, twice, both of which I got wrong low.
      #
      #   30m cap  -> killed silently (reported as "cancelled"), 2 weeks, no report
      #   24m      -> tripped at 24m42s, correctly and visibly
      #   40m      -> tripped at 40m40s
      #
      # 550 citation links, each up to 2 HTTP attempts at a 30s aiohttp timeout
      # plus a browser escalation, 16 domains at a time. It is simply a job that
      # takes the better part of an hour, and it runs once a week. Guessing the
      # budget down twice cost more than paying for it does.
      #
      # 80 minutes under a 90-minute job cap leaves room for the report and
      # issue-filing steps to run. The wrapper stays because the ONLY thing
      # that must never happen again is this job dying without saying so.
      # --max-retries 2, not 3. Each attempt is a full 30s aiohttp timeout plus
      # backoff, and it is the dominant cost for exactly the links that are
      # already failing. A third attempt at the same URL a few seconds later
      # has never been what distinguishes a live site from a dead one here --
      # the browser escalation is what does that, and it still runs.
      #
      # --timeout caps the BROWSER page load only (aiohttp's own timeout is a
      # separate hardcoded 30s). Cut 30 -> 15: the escalation exists to render
      # JS and get past bot walls, and a page that has not fired `load` in 15
      # seconds is not about to tell us anything useful -- it just costs the
      # worst case twice over.
      - name: Validate citation links
        id: validate
        run: |
          timeout --signal=INT 80m \
            uv run --with playwright python scripts/link-validation/link-validator.py \
              --input citation-links.json \
              --output citation-validation.json \
              --max-retries 2 \
              --timeout 15 \
          || { rc=$?; \
               if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then \
                 echo "::error::Citation validation exceeded its 80-minute budget."; \
               fi; exit "$rc"; }

          # Check if any GENUINELY broken links found (404 / 5xx / ssl_error /
          # dns_error / timeout). Access-restricted responses (403 / 401 /
          # paywall) are classified separately as "restricted" -- they're
          # publisher WAF blocks / login walls that a human reader can usually
          # still see fine, so they must NOT drive this alarm.
          BROKEN_COUNT=$(jq '[.results[] | select(.status == "broken")] | length' citation-validation.json)
          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT
          echo "Found $BROKEN_COUNT broken citation links"

          # Surface whether the browser budget ran out. A degraded run is fine
          # -- the HTTP verdict stands, which is what this job produced for
          # years while the escalation was silently disabled (#496) -- but it
          # must be VISIBLE rather than assumed.
          SKIPPED=$(jq '.stats.escalations_skipped // 0' citation-validation.json)
          ESC_SECS=$(jq '.stats.escalation_seconds // 0' citation-validation.json)
          echo "escalations_skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "Browser escalation used ${ESC_SECS}s; skipped $SKIPPED link(s) after the budget ran out."
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::Browser escalation budget exhausted; $SKIPPED link(s) kept their HTTP verdict."
          fi

          # Access-restricted / unverifiable links (advisory only, not an alarm)
          RESTRICTED_COUNT=$(jq '[.results[] | select(.status == "restricted")] | length' citation-validation.json)
          echo "restricted_count=$RESTRICTED_COUNT" >> $GITHUB_OUTPUT
          echo "Found $RESTRICTED_COUNT access-restricted (unverifiable) citation links"

          # Extract validation stats
          VALID_COUNT=$(jq '.stats.valid' citation-validation.json)
          REDIRECT_COUNT=$(jq '.stats.redirects' citation-validation.json)
          TIMEOUT_COUNT=$(jq '.stats.timeouts' citation-validation.json)
          ERROR_COUNT=$(jq '.stats.errors' citation-validation.json)

          echo "valid_count=$VALID_COUNT" >> $GITHUB_OUTPUT
          echo "redirect_count=$REDIRECT_COUNT" >> $GITHUB_OUTPUT
          echo "timeout_count=$TIMEOUT_COUNT" >> $GITHUB_OUTPUT
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: Generate markdown report
        if: steps.validate.outputs.broken_count > 0
        run: |
          uv run python scripts/link-validation/citation-report.py \
            --input citation-validation.json \
            --links citation-links.json \
            --output citation-report.md

      - name: Create or update issue
        if: steps.validate.outputs.broken_count > 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BROKEN_COUNT: ${{ steps.validate.outputs.broken_count }}
          RESTRICTED_COUNT: ${{ steps.validate.outputs.restricted_count }}
          VALID_COUNT: ${{ steps.validate.outputs.valid_count }}
          REDIRECT_COUNT: ${{ steps.validate.outputs.redirect_count }}
          TIMEOUT_COUNT: ${{ steps.validate.outputs.timeout_count }}
          ERROR_COUNT: ${{ steps.validate.outputs.error_count }}
          TOTAL_CITATIONS: ${{ steps.extract.outputs.total_citations }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('citation-report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];

            // Title/threshold/decision count only genuinely-broken links
            // (status 'broken': 404 / 5xx / ssl_error / dns_error / timeout).
            // Access-restricted responses (403 / 401 / paywall) are advisory
            // only -- surfaced in the body, but never in the alarm count or
            // title, since this whole step only runs when broken_count > 0.
            const title = '🔗 Broken Citation Links Detected';
            const body = [
              '## Citation Validation Report',
              '',
              `**Date:** ${date}`,
              `**Total Citations Checked:** ${process.env.TOTAL_CITATIONS}`,
              '**Validation Results:**',
              `- ✅ Valid: ${process.env.VALID_COUNT}`,
              `- ❌ Broken: ${process.env.BROKEN_COUNT}`,
              `- 🔒 Access-restricted (unverifiable, likely valid): ${process.env.RESTRICTED_COUNT}`,
              `- ↪️  Redirects: ${process.env.REDIRECT_COUNT}`,
              `- ⏱️  Timeouts: ${process.env.TIMEOUT_COUNT}`,
              `- ⚠️  Errors: ${process.env.ERROR_COUNT}`,
              '',
              '---',
              '',
              report,
              '',
              '---',
              '',
              '**Actions Required:**',
              '1. Review broken links above',
              '2. Find replacement sources or remove citations',
              '3. Update blog posts with fixes',
              '4. Re-run validation to verify fixes',
              '',
              '*This issue was automatically generated by the citation validation workflow.*',
              '*Run manually: Actions → Citation Link Validation → Run workflow*'
            ].join('\n');

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,citation-validation'
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated', 'citation-validation', 'maintenance']
              });
              console.log(`Created new issue #${newIssue.data.number}`);
            }

      - name: Comment on success
        if: steps.validate.outputs.broken_count == 0
        run: |
          echo "✅ No genuinely broken citation links found (${{ steps.extract.outputs.total_citations }} checked)."
          if [ "${{ steps.validate.outputs.restricted_count }}" -gt 0 ]; then
            echo "🔒 ${{ steps.validate.outputs.restricted_count }} link(s) are access-restricted (403/401/paywall) -- unverifiable by CI, not an alarm."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: citation-validation-report
          path: |
            citation-links.json
            citation-validation.json
            citation-report.md
          retention-days: 30
