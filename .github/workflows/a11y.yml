name: Accessibility (axe-playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # re-run on demand without an empty commit

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Job-level path gating instead of workflow-level `paths:` triggers —
  # `axe` is a REQUIRED branch-protection check, and trigger-filtered
  # workflows never report on non-matching PRs, wedging them as "expected"
  # forever. A skipped job still reports and satisfies protection.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
      rendertext: ${{ steps.rendertext.outputs.rendertext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/select-inputs.py a11y >> "$GITHUB_OUTPUT"
      # Does this PR touch anything that changes how a post RENDERS (a rehype
      # plugin, the schema, the Astro config, or a post with `marginNotes:
      # true`)? Only then is the base-vs-head text comparison below worth a
      # second build.
      - id: rendertext
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/rendered-text-gate.py applicable >> "$GITHUB_OUTPUT"

  axe:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
          check-latest: true  # astro 7.4+ needs >=22.23.4; the runner's cached 22 can lag
          cache: 'pnpm'
          cache-dependency-path: astro-site/pnpm-lock.yaml
      - name: Install UV (for the internal-link check)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Install deps
        run: cd astro-site && pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: cd astro-site && pnpm exec playwright install --with-deps chromium
      - name: Cache Astro font downloads (issue #408 — avoid transient jsdelivr fetch)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: astro-site/node_modules/.astro/fonts
          key: astro-fonts-${{ hashFiles('astro-site/astro.config.mjs', 'astro-site/pnpm-lock.yaml') }}
          restore-keys: |
            astro-fonts-
      # Astro keeps its content-layer store (render output of every post) in
      # .astro/ and node_modules/.astro/. A rehype plugin or config change does
      # not invalidate it, so a restored store would serve the OLD HTML for
      # unchanged Markdown. Nothing restores them today (only the fonts
      # subdirectory is cached above), but this keeps it true if a broader
      # cache is ever added: everything except the fonts is dropped.
      - name: Drop stale Astro content cache
        run: |
          rm -rf astro-site/.astro
          find astro-site/node_modules/.astro -mindepth 1 -maxdepth 1 ! -name fonts -exec rm -rf {} + 2>/dev/null || true
      - name: Build site
        run: cd astro-site && pnpm build
      # plaintext_gate.py reads post source, so it cannot see a plugin that
      # changes the rendered words. Build the base branch too (only when the
      # PR touches render inputs) and compare <main> text outside the margin
      # notes, post by post. The head build above is reused as-is.
      - name: Checkout base branch (rendered-text gate)
        if: github.event_name == 'pull_request' && needs.changes.outputs.rendertext == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-tree
      - name: Build base branch (rendered-text gate)
        if: github.event_name == 'pull_request' && needs.changes.outputs.rendertext == 'true'
        run: |
          cd base-tree/astro-site
          pnpm install --frozen-lockfile
          pnpm build
      - name: Rendered-text gate (text outside margin notes unchanged vs base)
        if: github.event_name == 'pull_request' && needs.changes.outputs.rendertext == 'true'
        run: >
          python3 scripts/ci/rendered-text-gate.py compare
          --base-dist base-tree/astro-site/dist --head-dist astro-site/dist
          --base-tree base-tree --head-tree .
      - name: Run full Playwright suite (smoke + a11y + theme-deck)
        run: cd astro-site && npx playwright test tests/e2e/
      # Was advisory AND continue-on-error, while reporting four genuine WCAG
      # failures in solarized-dark-higher-contrast on every green run (#511).
      # Those are fixed; this is a gate now. It is the only check in the repo
      # that measures real composited pixels rather than token values, so it
      # catches what the generator's contrast solver structurally cannot.
      # Internal links resolve against files on disk, so they are checked
      # there rather than over HTTP (issue #502). link-monitor.yml could never
      # catch these: aiohttp raises InvalidURL on a relative path, which is
      # recorded as `needs_manual`, and the gate only counts `broken`.
      # Deterministic and offline, so unlike the network check it can block.
      - name: Internal link + anchor check (blocking)
        run: uv run python scripts/link-validation/internal-link-check.py

      - name: Grain composited-contrast audit (real screenshot pixel sample — blocking)
        run: cd astro-site && pnpm audit:grain
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: axe-playwright-report
          path: astro-site/playwright-report/
          retention-days: 7
